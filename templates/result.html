    <style>
        body {
            font-family: Arial, sans-serif;
            background: url('{{ url_for("static", filename="back3.jpg") }}') no-repeat center center fixed;
            background-size: cover;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
            overflow: auto;
        }

        .container {
            display: flex;

            align-items: flex-start;
            width: 100%;
            height: 100%;
            padding: 20px;
            box-sizing: border-box;
        }

        .result-box {
            background: rgba(0, 0, 0, 0.7);
            padding: 40px;
            border-radius: 15px;
            border: 1px solid #ccc;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.3);
            width: 90%;
            max-width: 900px;
            color: #fff;
            text-align: center;
            overflow-y: auto;
            max-height: 90vh;
        }

        .result-text {
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .result-icon {
            font-size: 60px;
            margin-bottom: 20px;
        }

        .image-container {
            margin-top: 20px;
        }

        .image-container img {
            width: 100%;

            border: 1px solid #fff;
            border-radius: 10px;
        }

        .image-label {
            color: #fff;
            font-weight: bold;
            margin-top: 10px;
        }

        .action-buttons a {
            margin: 10px;
            font-size: 18px;
            padding: 10px 20px;
            color: #fff;
            border-radius: 5px;
            text-decoration: none;
            transition: all 0.3s ease;
        }

        .action-buttons a:hover {
            background-color: #3498db;
            color: #000;
        }

        .btn-primary {
            background-color: #2980b9;
        }

        .btn-secondary {
            background-color: #2c3e50;
        }

        .btn-primary:hover {
            background-color: #3498db;
        }

        .btn-secondary:hover {
            background-color: #34495e;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="result-box">
            <h2>Prediction Result</h2>
            <div class="result-icon">
                {% if result == 'Autistic' %}
                    <span style="color: #e74c3c;">&#9888;</span>
                {% else %}
                    <span style="color: #2ecc71;">&#9989;</span>
                {% endif %}
            </div>
            <div class="result-text">
                {% if result == 'Autistic' %}
                    Autism Detected
                {% else %}
                    No Autism Detected
                {% endif %}
            </div>

            <h3>The model's prediction is: {{ result }}</h3>
            <p>{{ explanation }}</p>

            <div class="action-buttons">
                <a href="{{ url_for('upload') }}" class="btn btn-primary">Upload Another Image</a>
                <a href="{{ url_for('dashboard') }}" class="btn btn-secondary">Back to Dashboard</a>
            </div>
        </div>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0-alpha1/js/bootstrap.bundle.min.js"></script>
</body>
</html>
